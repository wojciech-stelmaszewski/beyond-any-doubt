name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy in flight is left to finish rather than cancelled, so the live site
# is never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: the lockfile decides, and a build
      # that cannot be reproduced from it should fail here rather than ship.
      - run: npm ci

      # The state diagram in the Talemi post is a drawing of the `parse`
      # function the Lean proofs are about, and a drawing can drift from what
      # it depicts. This replays every word up to length five through both and
      # fails if they ever disagree. The expected verdicts are committed, so
      # the check needs Node and nothing else.
      - run: node scripts/check-automaton.mjs

      - run: npm run build

      # The custom domain lives in the repository's Pages settings, not in a
      # CNAME file: when publishing from a workflow, GitHub ignores that file.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
