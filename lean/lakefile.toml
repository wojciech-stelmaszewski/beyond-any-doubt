name = "banach"
defaultTargets = ["Banach", "Talemi"]

# Pinned to the Mathlib tag that is built against exactly the toolchain named in
# `lean-toolchain`. A mismatch does not fail loudly: it silently misses the
# prebuilt cache and turns a two-minute setup into an hour of compiling Mathlib.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "Banach"

# The numeral system from the Talemi post. In `defaultTargets` because it is
# finished work rather than exercises. It imports no Mathlib at all, so most of
# it elaborates in about a second; the ten seconds it actually costs are almost
# entirely the brute-force count at the end of Talemi/Enumeration.lean, which
# the kernel evaluates rather than the compiler.
[[lean_lib]]
name = "Talemi"

# Kept out of `defaultTargets` because the lessons are full of `sorry` by design:
# unfinished exercises are the normal state of a tutorial, and they must not make
# `lake build` or `scripts/verify.sh` go red. Build it explicitly with
# `lake build Tutorial`.
[[lean_lib]]
name = "Tutorial"
globs = ["Tutorial", "Tutorial.+"]

# Illustration only, and kept out of `defaultTargets` on purpose: linking an
# executable against Mathlib is slow, so `Main.lean` imports none of it.
[[lean_exe]]
name = "banach"
root = "Main"
